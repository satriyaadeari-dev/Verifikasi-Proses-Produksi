<header><div><h1>Verifikasi <span>Proses &amp; Output Produksi</span></h1><div class="sub">Pencatatan &amp; analitik temuan</div></div><div class="hr"><div class="dt" id="dt"></div><div class="clk" id="clk">--:--:--</div><div class="st off" id="st"><b>●</b> menghubungkan</div></div></header>

<nav><div><button data-t="input" onclick="go('input')"><i>✎</i>Input</button><button data-t="dash" onclick="go('dash')"><i>◔</i>Dashboard</button><button data-t="data" onclick="go('data')"><i>☰</i>Data</button></div></nav>

<script>

const devId=(()=>{try{let d=localStorage.getItem('vp_devid');if(!d){d='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);localStorage.setItem('vp_devid',d)}return d}catch(e){return 'd-lokal'}})();
const canEdit=r=>!r.owner||r.owner===devId,DENY='Data ini hanya bisa diedit atau dihapus oleh perangkat yang menginputnya';
const TMB=['Verifikasi Timbangan','Verifikasi APD'];
const LAP=['Verifikasi Proses','OS & IPQC','Premium','Durasi Ambri/Sap'],HARI=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'],DEF=['TS','PAK','KL','BTS','ATSP','ATSL','AT','UTR','Ambri Sobek','Lubang','Kotor','Bercak Minyak','Berkerut','Benda Asing','Gagang','IKM','Keropos'];

const pad=x=>String(x).padStart(2,'0'),hms=d=>[d.getHours(),d.getMinutes(),d.getSeconds()].map(pad).join(':');

const durBlank=()=>Array.from({length:15},()=>['','','']),osBlank=()=>Array.from({length:10},()=>({b:'',uh:'',ub:'',v:['','','','','']})),premBlank=()=>Array.from({length:60},()=>({n:'',s:'',q:'',d:['','','']}));

let rows=[],tab='input',F=blank(),editId=null,delId=null,grp='lokasi',rgrp='lokasi',df={from:'',to:'',lokasi:'',ver:'',batch:'',lap:'',q:''},nflt='',flt={from:'',to:'',lokasi:'',q:''},col=null;
